when:
  - event: pull_request
  - event: push
    branch: main

# Uses no secret, so an agent with location=cloud can run it.
labels:
  location: cloud

steps:
  check:
    image: ghcr.io/breeze4/beebaby-ci@sha256:10387c6d45d86aa1c138582566cc204749828663179a9b30df5ff320ff6e9f63
    commands:
      - bash scripts/ci-gates.sh all
